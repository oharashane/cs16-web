// AWP: one rifle, one shot. The other half of every 2003 server list — long sightlines,
// a scope, and a Deagle for when somebody gets close.
hostname "CS 1.6 - AWP"
csdm_active 0
gg_enabled 0
mp_freeforall 0

sv_gravity 800
sv_airaccelerate 10
sv_maxspeed 320
sv_enablebunnyhopping 1

mp_t_default_weapons_primary "awp"
mp_t_default_weapons_secondary "deagle"
mp_ct_default_weapons_primary "awp"
mp_ct_default_weapons_secondary "deagle"
mp_t_give_player_knife 1
mp_ct_give_player_knife 1
mp_free_armor 2

mp_roundtime 3
mp_freezetime 2
mp_startmoney 0
mp_buytime 0
mp_friendlyfire 0
mp_autoteambalance 1
mp_limitteams 2
mp_timelimit 15
mp_give_player_c4 0

mapcyclefile "modes/awp.maps.txt"
bot_allow_grenades 1
bot_allow_machine_guns 1
bot_allow_pistols 1
bot_allow_rifles 1
bot_allow_shield 1
bot_allow_shotguns 1
bot_allow_snipers 1
bot_allow_sub_machine_guns 1
bot_difficulty 0
bot_quota 0

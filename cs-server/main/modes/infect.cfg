// Infection: one side is armed, the other has knives, and everyone who dies changes
// sides. The idea under every zombie mod CS ever had, with none of their models, classes
// or shops — those are somebody else's thousands of lines, and they are on the list.
//
// Zombie Escape, the version Shane asked for, is this plus ze_ maps: long corridors with
// a door at the end and a timer. We have no ze_ maps; that is the gap the drive fills.
hostname "CS 1.6 - Infection"
csdm_active 1
gg_enabled 0
mp_freeforall 0

mm_infect 1
mm_strip 1
mm_knife 1
// A zombie takes more killing and moves faster than a person carrying a rifle.
mm_health 250
mm_armor 0
mm_speed 300

sv_gravity 800
sv_airaccelerate 10
sv_maxspeed 320
sv_enablebunnyhopping 1

mp_ct_default_weapons_primary "m4a1"
mp_ct_default_weapons_secondary "deagle"
mp_t_default_weapons_primary ""
mp_t_default_weapons_secondary ""
mp_free_armor 0
mp_roundtime 5
mp_freezetime 5
mp_startmoney 0
mp_buytime 0
mp_friendlyfire 0
mp_autoteambalance 0
mp_limitteams 0
mp_timelimit 15
mp_give_player_c4 0

mapcyclefile "modes/infect.maps.txt"
bot_quota 0
bot_allow_grenades 1
bot_allow_machine_guns 1
bot_allow_pistols 1
bot_allow_rifles 1
bot_allow_shield 1
bot_allow_shotguns 1
bot_allow_snipers 1
bot_allow_sub_machine_guns 1
bot_difficulty 0

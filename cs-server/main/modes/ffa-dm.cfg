// Free-for-all: CSDM respawns you and ReGameDLL's mp_freeforall makes everyone a target.
//
// NOT csdm_ffa.amxx. That plugin segfaults the server about two seconds after anyone
// joins a team, and it is not loaded — see plugins-csdm.ini. mp_freeforall is the engine's
// own, and it was tested against a real join before this file existed.
//
// Friendly fire is on because in free-for-all everybody is nominally a teammate; without
// it the shooting has no effect. Team balancing and the team limit are off for the same
// reason: the teams are a formality here.
hostname "CS 1.6 - Free-for-all"
csdm_active 1
gg_enabled 0
mp_freeforall 1
// Everyone is on a team even when nobody is on your side, so every kill counts as a team
// kill and the game's own autokick throws you out after three of them. Not here it does not.
mp_autokick 0
mp_tkpunish 0

sv_gravity 200
sv_airaccelerate 10
sv_maxspeed 320
sv_enablebunnyhopping 0

mp_roundtime 15
mp_freezetime 0
mp_startmoney 16000
mp_buytime 9
mp_friendlyfire 1
mp_autoteambalance 0
mp_limitteams 0
mp_timelimit 15

mapcyclefile "modes/ffa-dm.maps.txt"

// Scavenge: you spawn with a knife and nothing else, there is no buy menu, and every gun
// in the round is one the map put on the floor. This is what the fy_ maps ("fight yard")
// were built for — a pile of weapons in the middle and a sprint for it — and what
// Counter-Strike plays like with its economy taken out entirely.
//
// The rotation is chosen from the catalogue: maps that place at least five kinds of gun
// through armoury_entity. Maps that arm you at the moment of spawning instead
// (game_player_equip — scoutzknivez, awp_india, cs_deagle5) are NOT here: stripping on
// spawn would take away the very thing they hand out.
hostname "CS 1.6 - Scavenge"
csdm_active 0
gg_enabled 0
mp_freeforall 0

// Both teams stripped (1 = T, 2 = CT, so 3 = both), the knife given back.
mm_strip 3
mm_knife 1
mm_health 100
mm_armor 0
mm_speed 0
mm_infect 0

// Nothing from the game, nothing from the shop: the map is the armoury.
mp_weapons_allow_map_placed 1
mp_t_default_weapons_primary ""
mp_ct_default_weapons_primary ""
mp_t_default_weapons_secondary ""
mp_ct_default_weapons_secondary ""
mp_free_armor 0
mp_startmoney 0
mp_buytime 0
mp_buy_anywhere 0
mp_give_player_c4 0

sv_gravity 800
sv_airaccelerate 10
sv_maxspeed 320
sv_enablebunnyhopping 1

mp_roundtime 3
mp_freezetime 3
mp_friendlyfire 0
mp_autoteambalance 1
mp_limitteams 2
mp_timelimit 15
mp_footsteps 1

mapcyclefile "modes/scavenge.maps.txt"
bot_allow_grenades 1
bot_allow_machine_guns 1
bot_allow_pistols 1
bot_allow_rifles 1
bot_allow_shield 1
bot_allow_shotguns 1
bot_allow_snipers 1
bot_allow_sub_machine_guns 1
bot_difficulty 0
bot_quota 0

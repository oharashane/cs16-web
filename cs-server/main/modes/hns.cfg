// Hide and seek: the terrorists hide with a knife, the counter-terrorists come looking.
// No plugin ever made this work — a long round, no guns for the hiders, and an honour
// system did. The seekers are slowed so hiding is worth something.
hostname "CS 1.6 - Hide and Seek"
csdm_active 0
gg_enabled 0
mp_freeforall 0

// Strip the terrorists (bit 1), give the knife back.
mm_strip 1
mm_knife 1
mm_health 100
mm_armor 0
mm_speed 0
mm_infect 0

sv_gravity 800
sv_airaccelerate 10
sv_maxspeed 320
sv_enablebunnyhopping 1

// The seekers get a knife too: this is a game of finding, not of shooting.
mp_ct_default_weapons_primary ""
mp_ct_default_weapons_secondary ""
mp_t_default_weapons_primary ""
mp_t_default_weapons_secondary ""
mp_free_armor 0
mp_roundtime 6
mp_freezetime 15
mp_startmoney 0
mp_buytime 0
mp_friendlyfire 0
mp_autoteambalance 1
mp_limitteams 2
mp_timelimit 15
mp_give_player_c4 0
mp_footsteps 1
mp_flashlight 1

mapcyclefile "modes/hns.maps.txt"
bot_quota 0
bot_allow_grenades 1
bot_allow_machine_guns 1
bot_allow_pistols 1
bot_allow_rifles 1
bot_allow_shield 1
bot_allow_shotguns 1
bot_allow_snipers 1
bot_allow_sub_machine_guns 1
bot_difficulty 0

// 35hp: the duel. Thirty-five health, a Deagle each, and a small map — two shots decide
// it, which is why these servers ran all night in 2004. The health is the plugin's doing
// (museum.amxx); everything else is the game's.
hostname "CS 1.6 - 35hp duels"
csdm_active 0
gg_enabled 0
mp_freeforall 0

mm_health 35
mm_armor 0
mm_strip 0
mm_speed 0
mm_infect 0

sv_gravity 800
sv_airaccelerate 10
sv_maxspeed 320
sv_enablebunnyhopping 1

mp_t_default_weapons_primary ""
mp_ct_default_weapons_primary ""
mp_t_default_weapons_secondary "deagle"
mp_ct_default_weapons_secondary "deagle"
mp_free_armor 0
mp_roundtime 2
mp_freezetime 2
mp_startmoney 0
mp_buytime 0
mp_friendlyfire 0
mp_autoteambalance 1
mp_limitteams 2
mp_timelimit 15
mp_give_player_c4 0

mapcyclefile "modes/35hp.maps.txt"
bot_allow_grenades 1
bot_allow_machine_guns 1
bot_allow_pistols 1
bot_allow_rifles 1
bot_allow_shield 1
bot_allow_shotguns 1
bot_allow_snipers 1
bot_allow_sub_machine_guns 1
bot_difficulty 0
bot_quota 0

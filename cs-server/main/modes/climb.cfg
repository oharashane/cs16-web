// Climb: Kreedz. No opponents, no rounds worth the name — a map, a clock and a jump you
// have practised a thousand times. The settings are the ones the climbing community
// settled on: no speed cap on landing, high air control, and a knife.
//
// One map for now. The library is the museum's job: kz_, bhop_ and surf_ maps are the
// biggest gap in the collection, and the drive is where they come from.
hostname "CS 1.6 - Climb"
csdm_active 0
gg_enabled 0
mp_freeforall 0

sv_gravity 800
sv_accelerate 10
// No cap when you land, and enough air control to steer a jump.
sv_enablebunnyhopping 1
sv_airaccelerate 100
sv_maxspeed 320
sv_maxvelocity 3500
sv_stepsize 18
sv_stopspeed 75

mp_roundtime 9
mp_freezetime 0
mp_startmoney 0
mp_buytime 0
mp_friendlyfire 0
mp_autoteambalance 0
mp_limitteams 0
mp_timelimit 15
mp_give_player_c4 0
mp_t_default_weapons_primary ""
mp_ct_default_weapons_primary ""
mp_t_default_weapons_secondary ""
mp_ct_default_weapons_secondary ""
mp_footsteps 1
mp_flashlight 1

mapcyclefile "modes/climb.maps.txt"
bot_quota 0
bot_allow_grenades 1
bot_allow_machine_guns 1
bot_allow_pistols 1
bot_allow_rifles 1
bot_allow_shield 1
bot_allow_shotguns 1
bot_allow_snipers 1
bot_allow_sub_machine_guns 1
bot_difficulty 0

// Jailbreak: the counter-terrorists are guards with guns, the terrorists are prisoners
// with knives, and one guard talks. Nothing here enforces the rules — in 2005 nothing
// did either. Jailbreak was a game of obedience and revolt held together by a person on
// a microphone, and the plugins that came later only kept score of it.
hostname "CS 1.6 - Jailbreak"
csdm_active 0
gg_enabled 0
mp_freeforall 0

// Prisoners (terrorists) lose their guns and keep a knife.
mm_strip 1
mm_knife 1
mm_health 100
mm_armor 0
mm_speed 0
mm_infect 0

sv_gravity 800
sv_airaccelerate 10
sv_maxspeed 320
sv_enablebunnyhopping 1

mp_ct_default_weapons_primary "mp5navy"
mp_ct_default_weapons_secondary "usp"
mp_t_default_weapons_primary ""
mp_t_default_weapons_secondary ""
mp_free_armor 0
mp_roundtime 9
mp_freezetime 6
mp_startmoney 0
mp_buytime 0
mp_friendlyfire 1
mp_tkpunish 0
mp_autoteambalance 0
mp_limitteams 0
mp_timelimit 15
mp_give_player_c4 0

mapcyclefile "modes/jail.maps.txt"
bot_quota 0
bot_allow_grenades 1
bot_allow_machine_guns 1
bot_allow_pistols 1
bot_allow_rifles 1
bot_allow_shield 1
bot_allow_shotguns 1
bot_allow_snipers 1
bot_allow_sub_machine_guns 1
bot_difficulty 0

// Match: the 5v5 rules a league night ran on, as close as cvars get. Long rounds, a
// pistol round to start, friendly fire on, no auto-balance — the teams are the teams.
//
// What this is NOT: a match plugin. The knife round for sides, the ready-up, the half
// switch at fifteen and the score are all the job of a PUG plugin, which we do not have.
// This sets the rules; somebody still has to run the match.
hostname "CS 1.6 - Match (5v5)"
csdm_active 0
gg_enabled 0
mp_freeforall 0

sv_gravity 800
sv_airaccelerate 10
sv_maxspeed 320
sv_enablebunnyhopping 1

// The league numbers: a 1:45 round, six seconds to buy positions, 15 seconds of buy time,
// a 35-second bomb, and eight hundred dollars to start.
mp_roundtime 1.75
mp_freezetime 6
mp_startmoney 800
mp_buytime 0.25
mp_c4timer 35
mp_maxrounds 30
mp_timelimit 15
mp_friendlyfire 1
mp_tkpunish 1
mp_autoteambalance 0
mp_limitteams 0
mp_autokick 0
mp_hostagepenalty 0
// The dead watch their own team and nobody else: no calling out what you can see.
mp_forcecamera 2
mp_forcechasecam 2
mp_footsteps 1
mp_flashlight 1

mapcyclefile "modes/match.maps.txt"
bot_allow_grenades 1
bot_allow_machine_guns 1
bot_allow_pistols 1
bot_allow_rifles 1
bot_allow_shield 1
bot_allow_shotguns 1
bot_allow_snipers 1
bot_allow_sub_machine_guns 1
bot_difficulty 0
bot_quota 0
qs_enabled 0          // no announcer in a match

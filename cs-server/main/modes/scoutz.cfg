// Scoutzknivez: low gravity, high air control, and whatever the map hands you — which on
// these maps is a scout and a knife.
//
// CSDM is off on purpose. It strips what the map gives you and offers its own weapon
// menu, which is the opposite of the point here; rounds are short enough that waiting
// for the next one is no hardship.
hostname "CS 1.6 - Scoutzknivez"
csdm_active 0
gg_enabled 0
mp_freeforall 0

sv_gravity 350
sv_airaccelerate 100
sv_maxspeed 320
sv_enablebunnyhopping 1

mp_roundtime 5
mp_freezetime 1
mp_startmoney 0
mp_buytime 0
mp_friendlyfire 0
mp_autoteambalance 1
mp_limitteams 2
mp_timelimit 15

mapcyclefile "modes/scoutz.maps"

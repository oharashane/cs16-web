// The one Counter-Strike server. What kind of game it is running is not decided here —
// it is decided by modes/<name>.cfg, and changed while the server runs. This file holds
// only what is true of every mode: who it is, how it talks to the network, and its lock.
hostname "CS 1.6"
sv_contact ""

// Network. sv_lan 0 keeps Reunion happy about non-Steam clients, which every browser is.
sv_lan 0
sv_region 3
sv_maxrate 100000
sv_minrate 2500
sv_minupdaterate 20
sv_maxupdaterate 101
// Where a client fetches what it lacks — a map, a wad, a sky, a model — the game's own
// way: the relay serves the shared content (and, for the lab, the drive) at /raw/.
// Browsers reach it same-origin; native clients need the family login and fall back to
// the in-band download when they have not got it.
sv_downloadurl "https://cs16.darkoak.xyz/raw/"
sv_allowdownload 1
// How long a silent client is kept. The default is 60, and 60 is not enough here: a
// browser tab that loses focus stops calling requestAnimationFrame, so the engine stops
// sending, and a minute later the server drops a player who is only looking at their
// email. Measured 7 September 2026 — frozen at :05, "Reason: Timed out" at exactly :05
// plus sixty. Three minutes covers tabbing away; the cost is that a genuinely gone player
// holds a slot for that long, which on a sixteen-slot family server is nothing.
sv_timeout 180

// Logging: the room reads these files and turns them into rows.
log on
sv_logfile 1
sv_log_onefile 0
mp_logmessages 1
mp_logdetail 3

// From the environment at start; never written down here.
rcon_password "${RCON_PASSWORD}"

// The password players type into the lobby. Empty means the server is open to anyone who
// can reach it, which is the right default on a home network and the wrong one the moment
// the page is published. From cs-server/.env, never written down here.
sv_password "${SV_PASSWORD}"

sv_cheats 0
allow_spectators 1

exec reunion.cfg

// The mode this server comes up in, named by modes/current.cfg — which set_mode rewrites,
// and which amxx.cfg re-execs on every map so the mode survives the rotation.
exec modes/current.cfg

// The bots (ReGameDLL's, enabled in the image): none until asked for, and quiet — their
// radio lines are not in the browser client's bundle, and a missing sound is an in-band
// download. See docs/bots.md.
bot_quota 0
bot_quota_mode fill        // the quota counts people: bots fill the server to it and leave as people arrive
bot_chatter off
bot_join_after_player 1

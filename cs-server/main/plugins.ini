; Every mode's plugins, on one server. Which mode is running is decided at runtime by
; cvars — csdm_active, gg_enabled, mp_freeforall — set by the files in modes/, not by
; which plugins are loaded. A plugin whose mode is off sits idle.

; Admin base — required by everything below
admin.amxx
admincmd.amxx
adminhelp.amxx
adminslots.amxx
multilingual.amxx

; Menus
menufront.amxx
cmdmenu.amxx
plmenu.amxx
mapsmenu.amxx
pluginmenu.amxx

; Voting, map rotation, and the small things people expect
adminvote.amxx
timeleft.amxx
scrollmsg.amxx
nextmap.amxx
mapchooser.amxx
antiflood.amxx

; Gun Game. Idle unless gg_enabled is 1; see modes/gungame.cfg.
gungame.amxx

; CSDM's own plugins are listed in plugins-csdm.ini, which AMX Mod X loads on its own.
; They are idle unless csdm_active is 1. csdm_ffa.amxx is NOT among them: it segfaults
; the server on any team join. Free-for-all is ReGameDLL's mp_freeforall instead.

// The lab: the second server, where a map from the drive is played before anyone decides
// it belongs on main. Small, quiet, no modes: the game as it shipped, on whatever map the
// curator's desk last asked for. The same lock as main.
hostname "CS 1.6 - the lab"
sv_contact ""

sv_lan 0
sv_region 3
sv_maxrate 100000
sv_minrate 2500
sv_minupdaterate 20
sv_maxupdaterate 101
// Where a client fetches what it lacks — a map, a wad, a sky, a model — the game's own
// way: the relay serves the shared content (and, for the lab, the drive) at /raw/.
// Browsers reach it same-origin; native clients need the family login and fall back to
// the in-band download when they have not got it.
sv_downloadurl "https://cs16.darkoak.xyz/raw/"
sv_allowdownload 1
sv_timeout 180

log on
sv_logfile 1
sv_log_onefile 0
mp_logmessages 1
mp_logdetail 3

// From the environment at start; never written down here.
rcon_password "${RCON_PASSWORD}"
sv_password "${SV_PASSWORD}"

sv_cheats 0
allow_spectators 1
exec reunion.cfg

// Classic rules, and a map that does not end under the curator: no time limit, no round
// limit; the map changes when the desk says so.
mp_freeforall 0
sv_gravity 800
sv_airaccelerate 10
sv_maxspeed 320
mp_roundtime 5
mp_freezetime 3
mp_startmoney 16000
mp_buytime 1.5
mp_friendlyfire 0
mp_autoteambalance 0
mp_limitteams 0
mp_timelimit 0
mp_maxrounds 0
mp_weapons_allow_map_placed 1

// No bots: a bot builds a navigation mesh on a map it has not seen, which on five
// thousand unseen maps is five thousand meshes nobody asked for.
bot_quota 0
bot_chatter off

; CSDM's own plugin list. AMX Mod X loads any plugins-*.ini it finds beside plugins.ini,
; which is why this file must exist only in the deathmatch server's config directory —
; a copy in the image would turn classic and gungame into deathmatch too.

; Main plugin, required for most cases
csdm_main.amxx

; Weapons and equipment menus — the "guns" menu, built from the [primary] and
; [secondary] sections of csdm.cfg
csdm_equip.amxx

; Preset spawning. csdm.cfg sets spawnmode = none, so this only watches; it is kept
; loaded because the spawn editor lives in it.
csdm_spawn_preset.amxx

; Ammo refills and other small things
csdm_misc.amxx

; Removes map objectives (bomb sites, hostages) for deathmatch
csdm_stripper.amxx

; Spawn protection: a few seconds of immunity, and a glow to show it
csdm_protection.amxx

; Free-for-all — everybody against everybody, ignoring teams.
;
; OFF, AND IT MUST STAY OFF until someone finds a build that works. This plugin
; SEGFAULTS THE SERVER about two seconds after any player joins a team — every time,
; on ReHLDS/ReGameDLL with CSDM 2.1.3c. Bisected 2026-09-06: main+equip survives,
; main+equip+ffa crashes, the whole set minus ffa survives.
;
; It was enabled in September 2025 by the commit "tried and failed to get BHOP and CSDM
; FFA working", and it has been crashing the deathmatch server on every join since. The
; visible symptom is not a crash: it is a guns menu that offers only armor and grenades
; and then gives you neither, because the server dies before it can equip anybody.
;csdm_ffa.amxx

; Round ticketing mode: first team to spend its death points stops respawning.
;csdm_tickets.amxx

; Item mode with the item editor. Must also be enabled at the bottom of csdm.cfg.
;csdm_itemmode.amxx

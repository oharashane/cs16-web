# Three ReHLDS servers, one image. RCON_PASSWORD comes from ./.env (mode 600, not in git).
# darkoak's cs16 room starts and stops these by container name.
x-server: &server
  build: .
  image: cs16-server
  restart: unless-stopped
  environment: &env
    MAXPLAYERS: "16"
    RCON_PASSWORD: ${RCON_PASSWORD:?set RCON_PASSWORD in cs-server/.env}

services:
  classic:
    <<: *server
    container_name: cs16-classic
    environment:
      <<: *env
      PORT: "27015"
      MAP: fy_iceworld
    volumes:
      - ./shared:/content:ro
      - ./classic:/config:ro
      - ./logs/classic:/home/steam/csserver/cstrike/logs
    ports:
      - "27015:27015/udp"

  deathmatch:
    <<: *server
    container_name: cs16-deathmatch
    environment:
      <<: *env
      PORT: "27016"
      MAP: de_rats_1337
    volumes:
      - ./shared:/content:ro
      - ./deathmatch:/config:ro
      - ./logs/deathmatch:/home/steam/csserver/cstrike/logs
    ports:
      - "27016:27016/udp"

  gungame:
    <<: *server
    container_name: cs16-gungame
    environment:
      <<: *env
      PORT: "27017"
      MAP: de_rats_1337
    volumes:
      - ./shared:/content:ro
      - ./gungame:/config:ro
      - ./logs/gungame:/home/steam/csserver/cstrike/logs
    ports:
      - "27017:27017/udp"

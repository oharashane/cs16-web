# The Counter-Strike servers. RCON_PASSWORD comes from ./.env (mode 600, not in git).
# darkoak's cs16 room starts and stops these by container name.
#
# "main" is the one people play on: one server, every mode's plugins loaded, and which
# game it is running decided at runtime by the files in main/modes/. The three named
# after game types are the 2025 arrangement, kept on higher ports while each mode is
# proven on main, and to be retired after that.
x-server: &server
  build: .
  image: cs16-server
  restart: unless-stopped
  environment: &env
    MAXPLAYERS: "16"
    RCON_PASSWORD: ${RCON_PASSWORD:?set RCON_PASSWORD in cs-server/.env}
    # The password players type into the lobby. Compose reads .env for its own
    # substitutions, but a container only gets what is named here — leaving this out is
    # how the server came up with no password at all while .env said otherwise.
    SV_PASSWORD: ${SV_PASSWORD:-}

services:
  main:
    <<: *server
    container_name: cs16-main
    environment:
      <<: *env
      PORT: "27015"
      MAP: de_dust2_3x3
    volumes:
      - ./shared:/content:ro
      - ./main:/config:ro
      - ./logs/main:/home/steam/csserver/cstrike/logs
    # The host's network, not a published port: so the server sees each relay session's
    # own loopback address (127.0.0.2, .3, …) instead of docker-proxy's one address for
    # everyone, which ReHLDS took for one player reconnecting over and over.
    network_mode: host

  classic:
    <<: *server
    container_name: cs16-classic
    environment:
      <<: *env
      PORT: "27021"
      MAP: fy_iceworld
    volumes:
      - ./shared:/content:ro
      - ./classic:/config:ro
      - ./logs/classic:/home/steam/csserver/cstrike/logs
    ports:
      - "27021:27021/udp"

  deathmatch:
    <<: *server
    container_name: cs16-deathmatch
    environment:
      <<: *env
      PORT: "27022"
      MAP: de_rats_1337
    volumes:
      - ./shared:/content:ro
      - ./deathmatch:/config:ro
      - ./logs/deathmatch:/home/steam/csserver/cstrike/logs
    ports:
      - "27022:27022/udp"

  gungame:
    <<: *server
    container_name: cs16-gungame
    environment:
      <<: *env
      PORT: "27023"
      MAP: de_rats_1337
    volumes:
      - ./shared:/content:ro
      - ./gungame:/config:ro
      - ./logs/gungame:/home/steam/csserver/cstrike/logs
    ports:
      - "27023:27023/udp"

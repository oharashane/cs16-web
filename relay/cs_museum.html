<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>cs_museum</title>
<link rel="icon" href="/favicon.png" type="image/png"><link rel="stylesheet" href="/museum.css"><script>const __ME__ = __ME_JSON__;</script><script src="/museum.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/hlviewer.js@0.8.5/dist/hlviewer.js.css">
<style>
body{max-width:none;padding:0;overflow:hidden}
#hlv{position:fixed;inset:0;background:#000}
#hlv canvas{width:100vw!important;height:100vh!important;cursor:crosshair}
.hud{position:fixed;z-index:5;pointer-events:none}
#top{top:0;left:0;right:0;padding:10px 16px;background:linear-gradient(rgba(10,10,10,.85),rgba(10,10,10,0))}
#top nav.wings{border:0;margin:0;padding:0;pointer-events:auto}
#room{position:fixed;top:64px;left:16px;z-index:5;pointer-events:none;max-width:44vw}
#room b{display:block;font-size:1.3rem;color:var(--gold);text-shadow:0 1px 3px #000}
#room span{font-style:italic;color:var(--ink);text-shadow:0 1px 3px #000}
#plan{position:fixed;right:16px;top:64px;z-index:6;width:min(34vw,340px);background:rgba(10,10,10,.82);border:1px solid var(--line);border-radius:8px;padding:6px}
#plan canvas{width:100%;display:block;cursor:pointer}
#plan p{margin:.3rem 0 0;font-size:.75rem;opacity:.7}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(232,226,207,.8);z-index:5;pointer-events:none}
#prompt{position:fixed;left:50%;top:56%;transform:translateX(-50%);z-index:5;pointer-events:none;font-size:.95rem;text-shadow:0 1px 3px #000;background:rgba(10,10,10,.55);padding:3px 10px;border-radius:6px;display:none}
#prompt.on{display:block}#prompt kbd{border:1px solid var(--gold);color:var(--gold);border-radius:4px;padding:0 5px;margin-right:6px}
#resume{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;display:none;font-size:1rem;padding:.6rem 1.2rem}
#resume.on{display:block}
#help{position:fixed;bottom:16px;right:16px;z-index:5;font-size:.8rem;opacity:.8;text-align:right;text-shadow:0 1px 3px #000}
#help button,#help a{pointer-events:auto}
</style></head><body>
<div id="hlv"></div>
<div id="top" class="hud"><div data-nav="/cs_museum"></div></div>
<div id="room"><b>cs_museum</b><span>loading the building…</span></div>
<div id="plan"><canvas id="minimap" width="440" height="280"></canvas><p>The floor plan is the nav: click a room to go there. You are the blue dot.</p></div>
<div id="cross"></div><div id="prompt"><kbd>E</kbd><span id="prompt-text"></span></div>
<button type="button" id="resume" class="gold">Walk on — click to take the mouse again</button>
<div id="help">click the picture for the mouse · WASD to walk · <kbd>E</kbd> at a picture opens it · Esc frees the mouse<br><button type="button" id="walk" class="gold">Walk it in the game — the lab</button> <a href="/fly?path=cs_museum" target="_blank" class="small">plain fly-through</a></div>
<script src="https://cdn.jsdelivr.net/npm/hlviewer.js@0.8.5/dist/hlviewer.min.js"></script>
<script>
// The museum as a map, walked: hlviewer draws cs_museum.bsp (scripts/cs_museum.py); this
// page adds what a visitor needs that a fly-through lacks — walls that stop you, a floor
// to stand on, the mouse for looking, and E to activate what you face. A picture is a
// map on display: E turns it into a monitor showing that map through the museum's
// camera (the security monitors of cs_assault, in spirit), with the record, the
// fly-through and a game against a bot a click away. The theatre's screen plays the
// recording; the plinths open their stations. What you reach is read off the camera
// against the map's own list of things, which the generator wrote beside it.
const WALL_SENTENCE = { entrance: 'A 2003 game, still playable, kept with everything people made for it.', game: 'Pick a name; the seats fill with bots.', maps: 'Valve’s own, the server’s, and what the curators have hung.', models: 'Skins and weapons people made; wear one in your own game.', workshop: 'Where the museum is made.', recordings: 'Matches as they were played, replayed by the game itself.', machine: 'How a 2003 game runs in a browser tab.', timeline: '1996 to now, and where this museum sits on it.', world: 'The public servers still running today, asked directly.', corridor: '' };
let data = null, records = {};
const v = HLViewer.init('#hlv', { paths: { base: '/', replays: 'content/demos', maps: 'raw/maps', wads: 'raw/wads', skies: 'raw/gfx/env', sounds: 'raw/sound' } });
window.hlv = v; v.load('cs_museum.bsp');
fetch('/content/cs_museum/exhibits.json').then(r => r.json()).then(d => {
  data = d;
  data.things.forEach((t, i) => { t.i = i; });
  $('room').querySelector('span').textContent = 'walk in';
  const ready = () => { if (v.game && v.game.worldScene && v.game.worldScene.bsp) { arrive(); warm(); } else setTimeout(ready, 300); };
  ready();
});
window.addEventListener('hashchange', arrive);
// The game's files, fetched ahead: once the building is up, the base bundle comes down at
// low priority into the browser's cache (unless this browser already keeps it unpacked),
// and a map's bundle when you face its picture — so a game opened from here has its
// download behind it and only the unpacking left.
let manifest = null; const warmed = new Set();
async function warm() {
  try {
    manifest = await (await fetch('/content/manifest.json', { cache: 'no-store' })).json();
    const kept = await new Promise(resolve => { try { const r = indexedDB.open('cs16-content', 1); r.onerror = () => resolve(null); r.onsuccess = () => { const db = r.result; if (!db.objectStoreNames.contains('meta')) { resolve(null); return; } const g = db.transaction('meta').objectStore('meta').get('bundle:base'); g.onsuccess = () => resolve(g.result?.sha256 ?? null); g.onerror = () => resolve(null); }; } catch { resolve(null); } });
    if (kept !== manifest.base.sha256) fetch('/content/base.zip', { priority: 'low' }).catch(() => {});
    if (manifest.extras?.file) fetch('/content/' + manifest.extras.file, { priority: 'low' }).catch(() => {});
  } catch { /* no manifest, no warming */ }
}
function warmMap(name) {
  if (!manifest || warmed.has(name)) return; warmed.add(name);
  const m = manifest.maps.find(x => x.name === name); if (m) fetch('/content/' + m.file, { priority: 'low' }).catch(() => {});
}
api('/artifacts?kind=map&shown=1&size=200').then(d => { for (const a of d.items) records[a.id] = a; }).catch(() => {});

const cam = () => v.game && v.game.camera;
const inRect = (x, y, r, pad = 0) => x >= r[0] + pad && x <= r[2] - pad && y >= r[1] + pad && y <= r[3] - pad;
function roomAt(x, y) { if (!data) return null; for (const [k, r] of Object.entries(data.rooms)) if (inRect(x, y, r.rect)) return k; return null; }
// where a body may be: inside a room, a body's width from its walls, or in a doorway
const BODY = 20;
function allowed(x, y) {
  for (const r of Object.values(data.rooms)) if (inRect(x, y, r.rect, BODY)) return true;
  for (const d of data.doorways) { const [x0, y0, x1, y1] = d.rect; if (x >= x0 - BODY && x <= x1 + BODY && y >= y0 - BODY && y <= y1 + BODY && (x1 - x0 < y1 - y0 ? (y >= y0 + BODY && y <= y1 - BODY) : (x >= x0 + BODY && x <= x1 - BODY))) return true; }
  return false;
}
let last = null, shownRoom = null, target = null;
function tick() {
  requestAnimationFrame(tick);
  const c = cam(); if (!c || !data) return;
  // the floor and the walls: the camera stays at eye height; a step into a wall slides along it
  c.position[2] = data.eye;
  const [x, y] = c.position;
  if (last) {
    if (!allowed(x, y)) {
      if (allowed(x, last[1])) c.position[1] = last[1];
      else if (allowed(last[0], y)) c.position[0] = last[0];
      else { c.position[0] = last[0]; c.position[1] = last[1]; }
    }
  } else if (!allowed(x, y)) { const e = data.rooms.entrance.rect; c.position[0] = (e[0] + e[2]) / 2; c.position[1] = (e[1] + e[3]) / 2; }
  last = [c.position[0], c.position[1]];
  const key = roomAt(last[0], last[1]);
  if (key !== shownRoom) { shownRoom = key; const r = data.rooms[key]; $('room').innerHTML = `<b>${esc(r ? r.name : 'Outside')}</b><span>${esc(WALL_SENTENCE[key] || '')}</span>`; }
  // what you face, within reach: a picture, the screen, a plinth
  const yaw = c.rotation[1], fx = Math.cos(yaw), fy = Math.sin(yaw);
  let best = null, bestScore = 0;
  const consider = (t, reach) => {
    const dx = t.at[0] - last[0], dy = t.at[1] - last[1], d = Math.hypot(dx, dy);
    if (d > reach || d < 1) return;
    const facing = (dx / d) * fx + (dy / d) * fy;
    const front = t.facing[2] ? 1 : (last[0] - t.at[0]) * t.facing[0] + (last[1] - t.at[1]) * t.facing[1];
    if (facing > 0.7 && front > 0) { const score = facing * (1 - d / reach); if (score > bestScore) { best = t; bestScore = score; } }
  };
  for (const p of data.pictures) consider(p, 360);
  for (const t of data.things) consider(t, t.reach || 220);
  if (best !== target) { target = best; prompt(best); if (best && best.name && !best.kind) warmMap(best.name); }
  drawMinimap(last[0], last[1], yaw);
}
function prompt(t) {
  const el = $('prompt');
  if (!t) { el.classList.remove('on'); return; }
  $('prompt-text').textContent = t.kind === 'recording' ? 'play the recording' : t.kind === 'station' ? `open ${t.name}` : t.kind === 'clip' ? 'watch the clip' : t.kind === 'exhibit' ? 'see the exhibit' : `look at ${t.name} through the camera`;
  el.classList.add('on');
}
function activate(t) {
  if (!t) return;
  if (t.kind === 'recording') { showFrame('/recordings/' + encodeURIComponent(t.name), 'The theatre — ' + t.name); return; }
  if (t.kind === 'station' || t.kind === 'exhibit') { showFrame(t.href, t.name); return; }
  if (t.kind === 'clip') { showFrame('/story', 'Thirty seconds of it'); return; }
  history.replaceState(null, '', '#a/' + t.id);
  artifact(t.id, { monitor: true, link: location.origin + '/cs_museum#a/' + t.id });
}
// arriving by link: stand in front of the picture, and open it
function arrive() {
  const h = decodeURIComponent(location.hash.slice(1)); if (!h || !data) return;
  const p = data.pictures.find(x => h === 'a/' + x.id || h.toLowerCase() === x.name.toLowerCase()); if (!p) return;
  const c = cam(); if (!c) return;
  const back = 150;
  c.position[0] = p.at[0] + p.facing[0] * back; c.position[1] = p.at[1] + p.facing[1] * back; c.position[2] = data.eye;
  c.rotation[0] = 0; c.rotation[1] = Math.atan2(-p.facing[1], -p.facing[0]); last = null;
  history.replaceState(null, '', '#a/' + p.id);
  artifact(p.id, { monitor: true, link: location.origin + '/cs_museum#a/' + p.id });
}
document.addEventListener('keydown', e => { if ((e.key === 'e' || e.key === 'E') && !document.getElementById('peek')?.open) { e.preventDefault(); activate(target); } });
// the mouse: a click on the picture takes it for looking (hlviewer reads movementX once told
// the pointer is locked); Esc gives it back. An exhibit opening hands the mouse over — the
// game or the fly-through inside it may take it — and blocks the walk's keys; closing it
// takes the mouse back on the same click, which is the gesture a browser asks for. After an
// Esc-close there is no gesture, so a button asks for one.
const canvas = () => document.querySelector('#hlv canvas');
let wantMouse = false;
document.addEventListener('click', e => { const c = canvas(); if (c && e.target === c && !document.pointerLockElement) c.requestPointerLock(); });
document.addEventListener('pointerlockchange', () => { if (v.game) v.game.pointerLocked = !!document.pointerLockElement; if (document.pointerLockElement) $('resume').classList.remove('on'); });
window.onPeekOpen = () => { wantMouse = !!document.pointerLockElement; if (document.pointerLockElement) document.exitPointerLock(); if (v.game) v.game.keyboard.keys = {}; };
window.onPeekClose = () => { if (!wantMouse) return; const c = canvas(); if (!c) return; const p = c.requestPointerLock(); (p && p.catch ? p.catch(() => {}) : Promise.resolve()).then(() => { if (!document.pointerLockElement) $('resume').classList.add('on'); }); };
$('resume').addEventListener('click', () => { const c = canvas(); if (c) c.requestPointerLock(); $('resume').classList.remove('on'); });
window.addEventListener('keydown', e => { if (document.getElementById('peek')?.open && !e.target.closest('#peek')) e.stopImmediatePropagation(); }, true);
window.addEventListener('keyup', e => { if (document.getElementById('peek')?.open && !e.target.closest('#peek')) e.stopImmediatePropagation(); }, true);

// the museum's own floor plan, drawn the way the maps wing draws a map: rooms as painted floors, you as the blue dot
const mm = $('minimap'), mx = mm.getContext('2d');
let bounds = null;
function fit() {
  if (bounds) return bounds;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const r of Object.values(data.rooms)) { minX = Math.min(minX, r.rect[0]); minY = Math.min(minY, r.rect[1]); maxX = Math.max(maxX, r.rect[2]); maxY = Math.max(maxY, r.rect[3]); }
  const W = mm.width, H = mm.height, pad = 8, sc = Math.min((W - 2 * pad) / (maxX - minX), (H - 2 * pad) / (maxY - minY));
  return bounds = { minX, minY, sc, pad, W, H, px: v => pad + (v - minX) * sc, py: v => H - pad - (v - minY) * sc };
}
function drawMinimap(x, y, yaw) {
  const b = fit();
  mx.fillStyle = '#0a0a0a'; mx.fillRect(0, 0, b.W, b.H);
  for (const [k, r] of Object.entries(data.rooms)) {
    const [x0, y0, x1, y1] = r.rect;
    mx.fillStyle = k === shownRoom ? 'rgba(217,195,122,.35)' : 'rgba(138,122,92,.35)'; mx.fillRect(b.px(x0), b.py(y1), (x1 - x0) * b.sc, (y1 - y0) * b.sc);
    mx.strokeStyle = 'rgba(232,226,207,.4)'; mx.strokeRect(b.px(x0), b.py(y1), (x1 - x0) * b.sc, (y1 - y0) * b.sc);
    if (k !== 'corridor') { mx.fillStyle = '#e8e2cf'; mx.font = '600 10px system-ui'; mx.fillText(r.name.replace(/^The /, ''), b.px(x0) + 4, b.py(y1) + 12); }
  }
  mx.fillStyle = '#0a0a0a'; for (const d of data.doorways) { const [x0, y0, x1, y1] = d.rect; mx.fillRect(b.px(x0), b.py(y1), (x1 - x0) * b.sc, (y1 - y0) * b.sc); }
  mx.fillStyle = '#ffd166'; for (const p of data.pictures) { mx.beginPath(); mx.arc(b.px(p.at[0]), b.py(p.at[1]), 1.6, 0, 7); mx.fill(); }
  mx.fillStyle = '#8fd694'; for (const t of data.things) { mx.beginPath(); mx.arc(b.px(t.at[0]), b.py(t.at[1]), 2.4, 0, 7); mx.fill(); }
  mx.fillStyle = '#6fa8ff'; mx.beginPath(); mx.arc(b.px(x), b.py(y), 5, 0, 7); mx.fill();
  mx.strokeStyle = '#6fa8ff'; mx.lineWidth = 2; mx.beginPath(); mx.moveTo(b.px(x), b.py(y)); mx.lineTo(b.px(x) + Math.cos(yaw) * 14, b.py(y) - Math.sin(yaw) * 14); mx.stroke(); mx.lineWidth = 1;
}
mm.addEventListener('click', e => {
  if (!data) return; const b = fit();
  const rect = mm.getBoundingClientRect(), cx = (e.clientX - rect.left) * b.W / rect.width, cy = (e.clientY - rect.top) * b.H / rect.height;
  const x = b.minX + (cx - b.pad) / b.sc, y = b.minY + (b.H - b.pad - cy) / b.sc;
  const key = roomAt(x, y); if (!key) return;
  const r = data.rooms[key], c = cam(); if (!c) return;
  c.position[0] = (r.rect[0] + r.rect[2]) / 2; c.position[1] = (r.rect[1] + r.rect[3]) / 2; c.rotation[0] = 0; last = null;
});
$('walk').addEventListener('click', () => play('cs_museum', 'lab', false));
requestAnimationFrame(tick);
</script></body></html>
